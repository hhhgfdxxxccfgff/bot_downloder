<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎧 کاتالوگ موزیک</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        :root{--bg:#0f0f13;--card:#1a1a24;--accent:#8b5cf6;--text:#e2e8f0;--muted:#64748b;--green:#22c55e;--red:#ef4444;--yellow:#eab308}
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Vazirmatn',sans-serif}
        body{background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px}
        .header{padding:16px;background:linear-gradient(135deg,#1e1e2e,#0f0f13);position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #27272a}
        .header h1{font-size:1.2rem;background:linear-gradient(90deg,#a78bfa,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:12px}
        .card{background:var(--card);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s}
        .card:active{transform:scale(.98)}
        .card .cover{aspect-ratio:1;background:#27272a;position:relative}
        .card .cover img{width:100%;height:100%;object-fit:cover}
        .card .cover .duration{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.7);padding:2px 6px;border-radius:4px;font-size:.75rem}
        .card .info{padding:10px}
        .card .title{font-size:.9rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .card .artist{font-size:.8rem;color:var(--muted);margin-top:2px}
        .player-bar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,rgba(15,15,19,.95),#1a1a24);padding:12px 16px;display:none;align-items:center;gap:12px;border-top:1px solid #27272a;backdrop-filter:blur(10px)}
        .player-bar.active{display:flex}
        .player-bar .cover-thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;background:#27272a}
        .player-bar .details{flex:1;min-width:0}
        .player-bar .t{font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .player-bar .a{font-size:.75rem;color:var(--muted)}
        .player-bar audio{width:100%;height:36px}
        .locked-overlay{position:absolute;inset:0;background:rgba(0,0,0,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
        .locked-overlay .icon{font-size:2rem;margin-bottom:4px}
        .locked-overlay .cnt{font-size:.8rem;margin-top:4px}
        .btn{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:.85rem;cursor:pointer;margin-top:8px}
        .btn:active{opacity:.8}
        .empty{text-align:center;padding:40px;color:var(--muted)}
    </style>
</head>
<body>
    <div class="header">
        <h1>🎧 کاتالوگ موزیک</h1>
    </div>
    <div id="grid" class="grid"></div>
    <div id="player" class="player-bar">
        <img class="cover-thumb" id="p-cover">
        <div class="details">
            <div class="t" id="p-title"></div>
            <div class="a" id="p-artist"></div>
        </div>
        <audio id="audio" controls></audio>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        const initData = tg.initData;
        const grid = document.getElementById('grid');
        const player = document.getElementById('player');
        const audio = document.getElementById('audio');
        let current = null;

        function fmtDur(s){
            if(!s) return "0:00";
            const m = Math.floor(s/60);
            const sc = s%60;
            return m+":"+(sc<10?"0":"")+sc;
        }

        function fmtCountdown(sec){
            if(sec<=0) return "همین الان";
            const d = Math.floor(sec/86400);
            const h = Math.floor((sec%86400)/3600);
            const m = Math.floor((sec%3600)/60);
            if(d) return d+"روز و "+h+"ساعت";
            if(h) return h+"ساعت و "+m+"دقیقه";
            return m+"دقیقه";
        }

        async function load(){
            const res = await fetch('/w/api/catalog',{
                headers:{'X-Telegram-Init-Data':initData}
            });
            if(res.status!==200){grid.innerHTML='<div class="empty'>خطا در بارگذاری</div>';return;}
            const data = await res.json();
            grid.innerHTML = '';
            if(!data.length){grid.innerHTML='<div class="empty">آهنگی پیدا نشد</div>';return;}
            data.forEach(item=>{
                const el = document.createElement('div');
                el.className='card';
                const coverHtml = item.cover_url?`<img src="${item.cover_url}">`:'<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2rem">🎵</div>';
                const lockHtml = item.locked && !item.can_stream
                    ?`<div class="locked-overlay"><div class="icon">🔒</div><div class="cnt">${item.countdown?fmtCountdown(item.countdown):'قفل'}</div></div>`
                    :'';
                el.innerHTML = `
                    <div class="cover">${coverHtml}${lockHtml}<div class="duration">${fmtDur(item.duration)}</div></div>
                    <div class="info"><div class="title">${item.title}</div><div class="artist">${item.artist}</div></div>
                `;
                el.onclick = ()=>play(item);
                grid.appendChild(el);
            });
        }

        function play(item){
            current = item;
            document.getElementById('p-title').textContent = item.title;
            document.getElementById('p-artist').textContent = item.artist;
            document.getElementById('p-cover').src = item.cover_url || '';
            player.classList.add('active');
            if(item.stream_url){
                audio.src = item.stream_url;
                audio.play();
            }else if(item.locked){
                tg.showAlert('این آهنگ هنوز منتشر نشده! برای زودتر گوش دادن باید شرط‌ها رو تو بات کامل کنی.');
            }
        }
        load();
    </script>
</body>
</html>
